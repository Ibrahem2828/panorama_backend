name: Panorama Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: panorama_test
          POSTGRES_USER: panorama
          POSTGRES_PASSWORD: panorama_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U panorama -d panorama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://panorama:panorama_test_password@127.0.0.1:5432/panorama_test
      REDIS_URL: redis://127.0.0.1:6379/0
      FIELD_ENCRYPTION_KEY: ${{ secrets.CI_FIELD_ENCRYPTION_KEY }}
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/local.txt
      - name: Static syntax checks
        run: |
          python -m compileall -q app
          sh -n docker/entrypoint.sh
          sh -n docker/release.sh
      - name: Lint and security checks
        run: |
          ruff check app --select E9,F63,F7,F82
          bandit -q -r app -x '*/migrations/*,*/tests/*'
      - name: Django checks and migration drift
        working-directory: app
        run: |
          python manage.py check --settings=config.settings.testing
          python manage.py makemigrations --check --dry-run --settings=config.settings.testing
          python manage.py migrate --noinput --settings=config.settings.testing
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml --settings=config.settings.testing
      - name: Test suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Dependency audit
        run: pip-audit -r requirements/production.txt
