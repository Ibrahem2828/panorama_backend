name: Production Acceptance Gate

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: panorama_test
          POSTGRES_USER: panorama
          POSTGRES_PASSWORD: ci_test_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U panorama -d panorama_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      SECRET_KEY: ci-test-only-key
      DATABASE_URL: postgres://panorama:ci_test_only_password@127.0.0.1:5432/panorama_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PANORAMA_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      FIELD_ENCRYPTION_KEY: ci-test-only-encryption-key
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs the PR's parent commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Static checks
        run: |
          python -m compileall -q app
          ruff check .
          ruff format --check .
          mypy app
          bandit -q -r app -x '*/migrations/*,*/tests/*' --severity-level medium
          sh -n docker/entrypoint.sh
          sh -n docker/release.sh
          python -m py_compile scripts/smoke_test.py
      - name: Django contracts and migrations
        working-directory: app
        run: |
          python manage.py check --settings=config.settings.testing
          python manage.py makemigrations --check --dry-run --settings=config.settings.testing
          python manage.py migrate --noinput --settings=config.settings.testing
      - name: Validate canonical OpenAPI contract
        run: |
          python scripts/openapi_contract.py validate
          python scripts/openapi_contract.py check-drift
      - name: Generate and validate canonical API collections
        run: |
          python scripts/validate_api_collections.py
      - name: Verify generated API contracts are committed
        run: git diff --exit-code -- docs/api/openapi.json docs/api/openapi.yaml integrations/api/
      - name: Tests and coverage gate
        run: pytest -q --cov=apps --cov-fail-under=85 --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            htmlcov/
      - name: Dependency audit
        # GHSA-8pqf-f4m5-798g (CVE-2026-106454): ReDoS in twisted.mail.imap4 (the IMAP server). Panorama only uses Twisted
        # through daphne (HTTP/WebSocket) and never imports twisted.mail; no fixed release exists. Remove the ignore once
        # Twisted ships a fix.
        #
        # Time-boxed ignores for Twisted 26.4.0 (fixed only in 26.10.0rc1; no stable release yet; twisted 26.10.0 final
        # is the fix version): GHSA-vpp8-g58w-m8mp, CVE-2026-115778, CVE-2026-115774, CVE-2026-115775, CVE-2026-115776,
        # CVE-2026-115877, CVE-2026-83813. Reason: daphne only serves HTTP/1.1 + WebSocket; no telnet/IMAP/XMPP/IRC/
        # names (DNS) and no h2 (HTTP/2) in the lock. CVE-2026-115877 (request smuggling via bare CR/LF in header values)
        # depends on the reverse proxy rejecting bare CR/LF in headers - UNVERIFIED. Re-check when Twisted 26.10.0 is
        # released; REVIEW DATE 2026-12-15, then bump the lock and delete these ignores. Only these ids are ignored,
        # any new vulnerability still fails the gate. See docs/QUALITY_TESTING_AND_RELEASE.md.
        run: >-
          pip-audit -r requirements.lock
          --ignore-vuln GHSA-8pqf-f4m5-798g
          --ignore-vuln GHSA-vpp8-g58w-m8mp
          --ignore-vuln CVE-2026-115778
          --ignore-vuln CVE-2026-115774
          --ignore-vuln CVE-2026-115775
          --ignore-vuln CVE-2026-115776
          --ignore-vuln CVE-2026-115877
          --ignore-vuln CVE-2026-83813
      - name: Build production image
        run: |
          docker build --pull \
            --build-arg VCS_REF=${GITHUB_SHA} \
            --build-arg VERSION=ci-${GITHUB_SHA} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --tag panorama-backend:${GITHUB_SHA} .
      - name: Build conversion runtime image
        run: docker build --target conversion-runtime --pull --tag panorama-backend-conversion:${GITHUB_SHA} .
      - name: Validate Coolify Compose interpolation
        env:
          SECRET_KEY: ci-test-only-secret-key-that-is-not-used-at-runtime-123456789
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ALLOWED_HOSTS: api.example.test
          CSRF_TRUSTED_ORIGINS: https://api.example.test
          CORS_ALLOWED_ORIGINS: https://dashboard.example.test
          DATABASE_URL: postgres://panorama:ci_test_only_password@postgres:5432/panorama_test
          DATABASE_SSL_REQUIRE: "True"
          REDIS_URL: redis://redis:6379/0
          EMAIL_HOST: smtp.example.test
          EMAIL_HOST_USER: ci@example.test
          EMAIL_HOST_PASSWORD: ci-test-only-password
          APP_BASE_URL: https://api.example.test
          PORT: "8000"
          HEALTHCHECK_HOST: api.example.test
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          USE_X_FORWARDED_HOST: "True"
          POSTGRES_DB: panorama
          POSTGRES_USER: panorama
          POSTGRES_PASSWORD: ci-test-only-password
          IMAGE_TAG: ci-validation
          RELEASE_VERSION: ci
          BUILD_DATE: 2026-01-01T00:00:00Z
        run: docker compose -f docker-compose.coolify.yml config --quiet
      - name: TEMP DEBUG trivy all severities
        uses: aquasecurity/trivy-action@v0.33.1
        continue-on-error: true
        with:
          version: v0.75.0
          image-ref: panorama-backend:${{ github.sha }}
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.75.0
          image-ref: panorama-backend:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # trivy-action ignores `severity` for SARIF output unless this is set; without it the gate failed on
          # LOW/MEDIUM findings too.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          # Time-boxed ignores for the Twisted advisories (see .trivyignore, expire 2026-12-15).
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Upload image scan
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
      - name: Scan Docker and Compose configuration
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: panorama-backend:${{ github.sha }}
          artifact-name: panorama-sbom-${{ github.sha }}
          output-file: sbom.spdx.json
          format: spdx-json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
