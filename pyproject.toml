[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["**/migrations/*.py", ".venv", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra"
