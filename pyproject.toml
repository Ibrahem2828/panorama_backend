[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["**/migrations/*.py", ".venv", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra"
