# Coolify production compose. Configure its HTTP health check as GET
# /api/v1/health/ready/ and require HTTP 200 plus code=READY in the JSON body.
# The Docker health check below remains liveness-only by design.

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in Coolify}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in Coolify}
  DEBUG: "False"
  DJANGO_DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (managed or postgres service)}
  DATABASE_SSL_REQUIRE: ${DATABASE_SSL_REQUIRE:?set DATABASE_SSL_REQUIRE}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL (managed or redis service)}
  EMAIL_HOST: ${EMAIL_HOST:?set EMAIL_HOST}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?set EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?set EMAIL_HOST_PASSWORD}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  MEDIA_ROOT: /app/app/media
  MEDIA_URL: /media/
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
  PORT: ${PORT:?set PORT}
  HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:?set HEALTHCHECK_HOST}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:?set SECURE_SSL_REDIRECT}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?set SESSION_COOKIE_SECURE}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:?set CSRF_COOKIE_SECURE}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:?set SECURE_HSTS_SECONDS}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:?set SECURE_HSTS_INCLUDE_SUBDOMAINS}
  SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:?set SECURE_HSTS_PRELOAD}
  USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:?set USE_X_FORWARDED_HOST}
  RUN_SETUP_ADMIN_ACCOUNTS: ${RUN_SETUP_ADMIN_ACCOUNTS:-False}
  RUN_SEED_DATA: ${RUN_SEED_DATA:-False}
  RUN_SEED_PRODUCTION_DEFAULTS: ${RUN_SEED_PRODUCTION_DEFAULTS:-False}
  OTP_CLEANUP_RETENTION_DAYS: ${OTP_CLEANUP_RETENTION_DAYS:-1}

x-runtime-security: &runtime-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

x-runtime-resources: &runtime-resources
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: [*runtime-security, *runtime-resources]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
        VERSION: ${RELEASE_VERSION:?set RELEASE_VERSION}
        BUILD_DATE: ${BUILD_DATE:?set BUILD_DATE as ISO-8601 UTC}
    image: panorama-backend:${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8000"
    environment: *app-environment
    volumes:
      - static_data:/app/staticfiles
      - panorama_media:/app/app/media
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import json,http.client,os,sys; conn=http.client.HTTPConnection('127.0.0.1',int(os.environ['PORT']),timeout=3); conn.request('GET','/api/v1/health/live/',headers={'Host':os.environ['HEALTHCHECK_HOST']}); response=conn.getresponse(); body=json.loads(response.read()); sys.exit(0 if response.status == 200 and body.get('code') == 'LIVE' and body.get('data',{}).get('status') == 'live' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    <<: [*runtime-security, *runtime-resources]
    image: panorama-backend:${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
    restart: unless-stopped
    stop_grace_period: 75s
    command: celery -A config worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --concurrency=${CELERY_CONCURRENCY:-2}
    environment: *app-environment
    volumes:
      - panorama_media:/app/app/media
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination=celery@$$HOSTNAME --timeout=5 2>/dev/null | grep -q pong"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 60s

  conversion-worker:
    <<: [*runtime-security, *runtime-resources]
    build:
      context: .
      dockerfile: Dockerfile
      target: conversion-runtime
      args:
        VCS_REF: ${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
        VERSION: ${RELEASE_VERSION:?set RELEASE_VERSION}
        BUILD_DATE: ${BUILD_DATE:?set BUILD_DATE as ISO-8601 UTC}
    image: panorama-backend-conversion:${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
    restart: unless-stopped
    stop_grace_period: 180s
    command: celery -A config worker -Q conversion --loglevel=${CELERY_LOG_LEVEL:-INFO} --concurrency=${CELERY_CONVERSION_CONCURRENCY:-1}
    environment: *app-environment
    volumes:
      - panorama_media:/app/app/media
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.50"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination=celery@$$HOSTNAME --timeout=5 2>/dev/null | grep -q pong"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 90s

  beat:
    <<: [*runtime-security, *runtime-resources]
    image: panorama-backend:${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
    restart: unless-stopped
    stop_grace_period: 35s
    command: celery -A config beat --loglevel=${CELERY_LOG_LEVEL:-INFO} --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    environment: *app-environment
    volumes:
      - panorama_media:/app/app/media
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
    # Docker supervises the main beat process; the writable schedule lives only in tmpfs.
    healthcheck:
      test: ["CMD-SHELL", "test -w /tmp"]
      interval: 45s
      timeout: 5s
      retries: 3
      start_period: 45s

  release:
    <<: [*runtime-security, *runtime-resources]
    image: panorama-backend:${IMAGE_TAG:?set IMAGE_TAG to an immutable Git SHA}
    profiles: ["release"]
    restart: "no"
    stop_grace_period: 120s
    command: ["sh", "/app/docker/release.sh"]
    environment: *app-environment
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      disable: true

  # Enable these only with COMPOSE_PROFILES=self-hosted. No ports are published.
  # For Coolify-managed services, omit the profile and point DATABASE_URL/REDIS_URL at them.
  postgres:
    <<: *runtime-resources
    image: postgres:16-alpine
    profiles: ["self-hosted"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB for self-hosted mode}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER for self-hosted mode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for self-hosted mode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *runtime-resources
    image: redis:7-alpine
    profiles: ["self-hosted"]
    restart: unless-stopped
    stop_grace_period: 30s
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  static_data:
  # Coolify production should attach this as Application > Storages > Volume.
  panorama_media:
